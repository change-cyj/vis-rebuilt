/* =====================================================================
 * 术语内联可视化 —— 纯 SVG 字符串生成，零依赖（不依赖 D3 / CDN）
 * 目的：让抽象名词也有一个看得见的形状，帮助建立直觉。
 * ===================================================================== */
const svgWrap = (vb, inner) =>
  `<svg class="gl-viz-svg" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

const VIZ = {
  /* ① DIKW 金字塔 */
  dikw() {
    const L = [
      ["数据", "Data", "#e0e7ff", "#3730a3"],
      ["信息", "Information", "#a5b4fc", "#312e81"],
      ["知识", "Knowledge", "#4f46e5", "#ffffff"],
      ["智慧", "Wisdom", "#1e1b4b", "#ffffff"],
    ];
    const hw = f => 20 + f * 132;
    let g = "";
    L.forEach(([zh, en, c, tc], i) => {
      const f1 = i / 4, f2 = (i + 1) / 4, y1 = 8 + i * 24, y2 = y1 + 24;
      g += `<polygon points="${160 - hw(f1)},${y1} ${160 + hw(f1)},${y1} ${160 + hw(f2)},${y2} ${160 - hw(f2)},${y2}" fill="${c}" stroke="#fff" stroke-width="1.5"/>`;
      g += `<text x="160" y="${y1 + 12}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${tc}">${zh}</text>`;
      g += `<text x="160" y="${y1 + 20}" text-anchor="middle" font-size="6.5" fill="${tc}" opacity="0.85">${en}</text>`;
    });
    g += `<line x1="308" y1="104" x2="308" y2="14" stroke="#94a3b8" stroke-width="1.2"/>`;
    g += `<polygon points="308,6 303,15 313,15" fill="#94a3b8"/>`;
    g += `<text x="299" y="60" text-anchor="end" font-size="7" fill="#94a3b8" transform="rotate(-90 299 60)">加工深度</text>`;
    return svgWrap("0 0 320 112", g);
  },

  /* ⑤ CIE Lab 色域边界 */
  labgamut() {
    const cx = 160, cy = 60;
    const P = [[95, 0], [80, 55], [45, 82], [0, 95], [-48, 80], [-78, 50], [-95, 0], [-80, -42], [-50, -72], [0, -85], [58, -68], [88, -18]];

    g += `<text x="${cx + 122}" y="${cy + 12}" font-size="8" fill="#64748b">a*（绿 ← → 红）</text>`;
    g += `<text x="${cx + 6}" y="${cy - 58}" font-size="8" fill="#64748b">b*（蓝 ↓ 黄 ↑）</text>`;
    [[80, 62, "#e11d48", "红"], [-72, 78, "#16a34a", "绿"], [72, -98, "#2563eb", "蓝"]].forEach(([a, b, c, n]) => {

  },

  /* ⑥ 色轮与配色规则 */
  wheel() {
    const cx = 160, cy = 62, R = 48;
    let g = "";
    for (let i = 0; i < 36; i++) {
      const a0 = (i * 10 - 90) * Math.PI / 180, a1 = ((i + 1) * 10 - 90) * Math.PI / 180;
      g += `<path d="M${cx},${cy} L${(cx + R * Math.cos(a0)).toFixed(1)},${(cy + R * Math.sin(a0)).toFixed(1)} A${R},${R} 0 0 1 ${(cx + R * Math.cos(a1)).toFixed(1)},${(cy + R * Math.sin(a1)).toFixed(1)} Z" fill="hsl(${i * 10},72%,58%)" stroke="#fff" stroke-width="0.5"/>`;
    }
    const on = (h) => {
      const a = (h - 90) * Math.PI / 180;
      return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
    };
    // 互补：0° 与 180°
    const c1 = on(0), c2 = on(180);
    g += `<line x1="${c1[0]}" y1="${c1[1]}" x2="${c2[0]}" y2="${c2[1]}" stroke="#1e1b4b" stroke-width="1.1" stroke-dasharray="3 2"/>`;
    // 三等分
    [0, 120, 240].forEach(h => { const p = on(h); g += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#1e1b4b" stroke="#fff" stroke-width="1"/>`; });
    // 邻近
    [340, 20].forEach(h => { const p = on(h); g += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="#1e1b4b" stroke-width="1.2"/>`; });
    g += `<text x="160" y="122" text-anchor="middle" font-size="7.5" fill="#64748b">■ 三角（等距 120°）○ 邻近（相隔 20°）虚线 互补（相隔 180°）</text>`;
    return svgWrap("0 0 320 132", g);
  },

  /* ⑧ Marching Squares 单元插值 */
  marching() {
    const M = [[0.9, 0.8, 0.4, 0.2], [0.85, 0.7, 0.35, 0.15], [0.5, 0.45, 0.25, 0.1], [0.3, 0.2, 0.12, 0.05]];
    const TH = 0.5, cs = 46, x0 = 74, y0 = 12;
    let g = "";
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const avg = (M[i][j] + M[i][j + 1] + M[i + 1][j] + M[i + 1][j + 1]) / 4;
      g += `<rect x="${x0 + j * cs}" y="${y0 + i * cs}" width="${cs}" height="${cs}" fill="${avg >= TH ? "#dbeafe" : "#f8fafc"}" stroke="#e2e8f0"/>`;
    }
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      g += `<text x="${x0 + j * cs + 2}" y="${y0 + i * cs + 9}" font-size="6" fill="#94a3b8">${M[i][j]}</text>`;
    }
    const ip = (v1, v2) => (TH - v1) / (v2 - v1);
    const E = {
      T: (i, j) => [x0 + j * cs + ip(M[i][j], M[i][j + 1]) * cs, y0 + i * cs],
      B: (i, j) => [x0 + j * cs + ip(M[i + 1][j], M[i + 1][j + 1]) * cs, y0 + (i + 1) * cs],
      L: (i, j) => [x0 + j * cs, y0 + i * cs + ip(M[i][j], M[i + 1][j]) * cs],
      R: (i, j) => [x0 + (j + 1) * cs, y0 + i * cs + ip(M[i][j + 1], M[i + 1][j + 1]) * cs],
    };
    const CASE = { 1: [["L", "T"]], 2: [["T", "R"]], 3: [["L", "R"]], 4: [["R", "B"]], 5: [["L", "T"], ["R", "B"]], 6: [["T", "B"]], 7: [["L", "B"]], 8: [["B", "L"]], 9: [["T", "B"]], 10: [["T", "R"], ["B", "L"]], 11: [["R", "B"]], 12: [["L", "R"]], 13: [["T", "R"]], 14: [["L", "T"]] };
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const idx = (M[i][j] >= TH ? 1 : 0) | (M[i][j + 1] >= TH ? 2 : 0) | (M[i + 1][j + 1] >= TH ? 4 : 0) | (M[i + 1][j] >= TH ? 8 : 0);
      (CASE[idx] || []).forEach(([e1, e2]) => {
        const [p1, p2] = [E[e1](i, j), E[e2](i, j)];
        g += `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>`;
      });
    }
    g += `<text x="${x0}" y="158" font-size="7" fill="#94a3b8">阈值 = 0.5：蓝块 = 高于阈值，深线 = 等值线</text>`;
    return svgWrap("0 0 320 164", g);
  },

  /* ⑨ 阿基米德螺旋 */
  spiral() {
    const cx = 160, cy = 56, a = 6, b = 4;
    let pts = [];
    for (let t = 0; t <= Math.PI * 4; t += 0.08) {
      const r = a + b * t;
      pts.push([(cx + r * Math.cos(t)).toFixed(1), (cy + r * Math.sin(t)).toFixed(1)]);
    }
    let g = `<path d="M${pts.map(p => p.join(",")).join(" L")}" fill="none" stroke="#ea580c" stroke-width="1.6"/>`;
    for (let k = 0; k <= 8; k++) {
      const t = k * Math.PI / 2, r = a + b * t;
      g += `<circle cx="${(cx + r * Math.cos(t)).toFixed(1)}" cy="${(cy + r * Math.sin(t)).toFixed(1)}" r="2.6" fill="#1e1b4b"/>`;
    }
    g += `<text x="160" y="122" text-anchor="middle" font-size="7.5" fill="#64748b">半径 r = a + bθ　→　等角度间隔 = 等半径增量（黑点为每 90°）</text>`;
    return svgWrap("0 0 320 132", g);
  },

  bank45() {
    const S = [[0, 1], [1, 2.2], [2, 1.6], [3, 3.1], [4, 2.8], [5, 4]];

      s += `<text x="${ox + w / 2}" y="98" text-anchor="middle" font-size="7.5" font-weight="600" fill="#334155">${label}</text>`;
      s += `<text x="${ox + w / 2}" y="110" text-anchor="middle" font-size="7" fill="#94a3b8">${note}</text>`;

  /* ⑬ 日历热图 */

    const blue = ["#f1f5f9", "#dbeafe", "#93c5fd", "#3b82f6", "#1e3a8a"];

    for (let r = 0; r < 7; r++) {

      for (let c = 0; c < 13; c++) {
        const n = Math.abs(Math.sin(r * 12.9898 + c * 78.233) * 43758.5453) % 1;

  polar() {
    const cx = 108, cy = 58, R = 40;
    let g = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#e2e8f0"/>`;
    const put = (deg, r, c, name) => {
      const a = (deg - 90) * Math.PI / 180;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c}" stroke-width="1.3" stroke-dasharray="3 2"/>`;
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${c}"/>`;
      g += `<text x="${(x + 7).toFixed(1)}" y="${(y + 3).toFixed(1)}" font-size="7.5" fill="${c}">${name}</text>`;
      return [x, y];
    };
    const p = put(38, R, "#2563eb", "1 月");
    g += `<path d="M${cx},${cy - 16} A16,16 0 0 1 ${(cx + 16 * Math.cos((38 - 90) * Math.PI / 180)).toFixed(1)},${(cy + 16 * Math.sin((38 - 90) * Math.PI / 180)).toFixed(1)}" fill="none" stroke="#64748b" stroke-width="1"/>`;
    put(142, R * 0.78, "#db2777", "7 月");
    g += `<text x="${cx}" y="${cy + 3}" font-size="7" fill="#94a3b8">角 θ</text>`;
    g += `<text x="${(cx + 26).toFixed(1)}" y="${cy - 20}" font-size="7" fill="#64748b">半径 r</text>`;
    g += `<text x="196" y="42" font-size="7.5" fill="#64748b">周期性数据（小时、</text>`;
    g += `<text x="196" y="54" font-size="7.5" fill="#64748b">月份）用角度 + 半径</text>`;
    g += `<text x="196" y="66" font-size="7.5" fill="#64748b">比直角坐标更自然：</text>`;
    g += `<text x="196" y="78" font-size="7.5" fill="#64748b">1 月与次年 1 月重合</text>`;
    return svgWrap("0 0 320 116", g);
  },

    let g = "";
    g += `<rect x="6" y="8" width="148" height="96" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>`;

    g += `<text x="240" y="22" text-anchor="middle" font-size="8" font-weight="600" fill="#334155">合成数据</text>`;
    for (let i = 0; i < 26; i++) {
      g += `<circle cx="${(20 + rnd() * 120).toFixed(1)}" cy="${(34 + rnd() * 58).toFixed(1)}" r="3" fill="#6366f1" opacity="0.72"/>`;

    const raw = [320, 45, 180, 12];
    let g = "";
    g += `<text x="80" y="14" text-anchor="middle" font-size="7.5" font-weight="600" fill="#334155">原始（量纲不一）</text>`;
    g += `<text x="245" y="14" text-anchor="middle" font-size="7.5" font-weight="600" fill="#334155">归一化到 0–1</text>`;
    raw.forEach((v, i) => {
      const h = (v / 320) * 70;
      g += `<rect x="${22 + i * 30}" y="${94 - h}" width="20" height="${h}" rx="2" fill="#6366f1"/>`;
      g += `<text x="${32 + i * 30}" y="${110}" text-anchor="middle" font-size="6.5" fill="#94a3b8">${v}</text>`;
    });
    const mx = Math.max(...raw), mn = Math.min(...raw);
    raw.forEach((v, i) => {
      const nv = (v - mn) / (mx - mn), h = nv * 70;
      g += `<rect x="${186 + i * 30}" y="${94 - h}" width="20" height="${h}" rx="2" fill="#4338ca"/>`;
      g += `<text x="${196 + i * 30}" y="${110}" text-anchor="middle" font-size="6.5" fill="#94a3b8">${nv.toFixed(2)}</text>`;
    });
    g += `<text x="160" y="124" text-anchor="middle" font-size="7.5" fill="#64748b">压到同一区间后，不同量纲的指标才能公平比较</text>`;
    return svgWrap("0 0 320 132", g);
  },

  /* ㉛ 曲线拟合 */
  curvefit() {
    let s = 3;
    const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    let g = "";
    g += `<line x1="30" y1="100" x2="300" y2="100" stroke="#cbd5e1"/>`;
    g += `<line x1="30" y1="16" x2="30" y2="100" stroke="#cbd5e1"/>`;
    for (let i = 0; i < 30; i++) {
      const x = 36 + i * 8.6, base = 96 - i * 2.4, y = base + (rnd() - 0.5) * 22;
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="#6366f1" opacity="0.7"/>`;
    }
    g += `<line x1="36" y1="95" x2="292" y2="33" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3"/>`;
    g += `<text x="284" y="28" font-size="7" fill="#dc2626">拟合线</text>`;
    g += `<text x="160" y="118" text-anchor="middle" font-size="7.5" fill="#64748b">用一条光滑曲线概括散点趋势，同时保留残差信息</text>`;
    return svgWrap("0 0 320 126", g);
  },

  /* ㉜ 时间尺度 */
  timescale() {
    let g = "";
    const mn = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
    g += `<text x="80" y="14" text-anchor="middle" font-size="7.5" font-weight="600" fill="#334155">线性（直线轴）</text>`;
    g += `<line x1="20" y1="60" x2="140" y2="60" stroke="#cbd5e1"/>`;
    mn.forEach((m, i) => {
      const x = 24 + i * 10.2;
      g += `<line x1="${x.toFixed(1)}" y1="56" x2="${x.toFixed(1)}" y2="64" stroke="#94a3b8"/>`;
    });
    g += `<text x="20" y="80" font-size="6.5" fill="#64748b">1 月 —— 12 月</text>`;
    g += `<text x="245" y="14" text-anchor="middle" font-size="7.5" font-weight="600" fill="#334155">循环（圆环轴）</text>`;
    const cx = 245, cy = 62, R = 34;
    g += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#e2e8f0"/>`;
    mn.forEach((m, i) => {
      const a = (i * 30 * Math.PI) / 180 - Math.PI / 2;
      g += `<circle cx="${(cx + R * Math.cos(a)).toFixed(1)}" cy="${(cy + R * Math.sin(a)).toFixed(1)}" r="2.6" fill="#6366f1"/>`;
    });
    g += `<circle cx="${cx}" cy="${cy}" r="3" fill="#4338ca"/>`;
    g += `<text x="160" y="122" text-anchor="middle" font-size="7.5" fill="#64748b">线性轴强调增长，圆环轴强调周期；同一份数据的两种读法</text>`;
    return svgWrap("0 0 320 130", g);
  },

  /* ㉝ van Wijk 布局 */
  vanwijk() {
    let g = "";
    const days = [31, 28, 31, 30];
    const names = ["1 月", "2 月", "3 月", "4 月"];
    const bw = 74, x0 = 8, y0 = 22;
    days.forEach((d, m) => {
      const x = x0 + m * (bw + 4);
      g += `<text x="${x + bw / 2}" y="${y0 - 6}" text-anchor="middle" font-size="7" fill="#334155">${names[m]}</text>`;
      g += `<rect x="${x}" y="${y0}" width="${bw}" height="${bw}" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>`;
      for (let k = 0; k < d; k++) {
        const col = Math.floor(k / 7), row = k % 7;
        g += `<rect x="${(x + 4 + col * 9.6).toFixed(1)}" y="${(y0 + 6 + row * 9.6).toFixed(1)}" width="8.4" height="8.4" rx="1.6" fill="#6366f1" opacity="${(0.5 + (col % 3) * 0.16).toFixed(2)}"/>`;
      }
    });
    g += `<text x="160" y="118" text-anchor="middle" font-size="7.5" fill="#64748b">月为块、日为格：四个月同构排列，全年 12 个月依此类推</text>`;
    return svgWrap("0 0 320 128", g);
  },
};

/* 开发期自检：新增键若与旧键重名会被静默覆盖，此处显式提示 */
if (new Set(Object.keys(VIZ)).size !== Object.keys(VIZ).length) {
  console.warn("[glossary] VIZ 存在重复键，请检查");
}

/* 术语 → 可视化 的映射（挂在 render 里） */
const VIZ_TERMS = {
  "DIKW 模型": { k: "dikw", cap: "加工深度：数据 → 信息 → 知识 → 智慧" },
  "测量尺度": { k: "scales", cap: "四种尺度允许的运算逐级变多，能映射的通道也随之变精确" },
  "表达力排序": { k: "channels", cap: "Mackinlay (1986)：通道按“读数精确度”排序" },
  "顺序型 colormap": { k: "seq", cap: "浅 → 深，方向单一" },
  "发散型 colormap": { k: "div", cap: "蓝 — 白 — 红，中间为基准" },
  "分类型 colormap": { k: "cat", cap: "类别之间只需彼此区分" },
  "CIE Lab": { k: "labgamut", cap: "在 a*–b* 平面上看 sRGB 色域的形状" },
  "色轮": { k: "wheel", cap: "邻近 / 互补 / 三角：所有配色规则的几何来源" },
  "等值线": { k: "contour", cap: "等值线是标量场的“等高线”读法" },
  "Marching Squares": { k: "marching", cap: "每个单元按 4 角与阈值比较，插值出线段" },
  "阿基米德螺旋": { k: "spiral", cap: "半径随角度线性增长" },
  "45° 黄金角": { k: "bank45", cap: "调长宽比，让平均斜率贴近 45°" },
  "对数坐标": { k: "logscale", cap: "把跨数量级的数据“拉平”" },
  "小倍数": { k: "smallmult", cap: "同一结构重复分面，便于并排比较" },
  "日历热图": { k: "calheat", cap: "把一年压进一屏网格" },
  "Reingold-Tilford 算法": { k: "rtree", cap: "同层不重叠、左右对称" },
  "极坐标": { k: "polar", cap: "角度 + 半径，天然适合周期数据" },
  "彩虹色系": { k: "rainbow", cap: "为什么它常常是错的" },
  "viridis": { k: "viridis", cap: "感知均匀 + 色盲友好" },
  /* --- 新增 16 项（v2） --- */
  "数据质量四维度": { k: "dataqual", cap: "准确性 / 完整性 / 一致性 / 时效性，任一不达标即不合格" },
  "合成数据": { k: "synthetic", cap: "由模型生成的“假”数据，用于教学与测试" },
  "视觉通道": { k: "vchannel", cap: "同一组数据，换一个通道编码，可读性就不同" },
  "Card 数据流模型": { k: "cardflow", cap: "原数据 → 数据表 → 视觉结构 → 视图" },
  "聚合": { k: "rollup", cap: "明细行按分类收拢成一行" },
  "数据连接": { k: "datajoin", cap: "数据数组与 DOM 元素按序绑定（enter / update / exit）" },
  "事件委托": { k: "delegate", cap: "父节点统一监听，靠事件冒泡处理子元素" },
  "颜色空间": { k: "colorspace", cap: "RGB / HSV / Lab：描述颜色的三套坐标系" },
  "RGB 色彩模式": { k: "rgbadd", cap: "红绿蓝加色混合出屏幕上的所有颜色" },
  "感知均匀": { k: "perceptuni", cap: "等量的数值变化，看起来也是等量变化" },
  "色觉障碍": { k: "cvd", cap: "约 8% 男性有红绿色觉障碍，配色必须考虑" },
  "标度 / scale": { k: "scalemap", cap: "把数据域线性映射到屏幕值域" },
  "归一化": { k: "norm", cap: "把不同量纲的指标压到同一区间" },
  "曲线拟合": { k: "curvefit", cap: "用一条光滑曲线概括散点趋势" },
  "时间尺度": { k: "timescale", cap: "线性 vs 循环：时间轴的两种选择" },
  "van Wijk 布局": { k: "vanwijk", cap: "月为块、日为格，把一年压进一屏" },
};

const listEl = document.getElementById("gl-list");
const inputEl = document.getElementById("gl-input");
const catsEl = document.getElementById("gl-cats");
const countEl = document.getElementById("gl-count");
let activeCat = "全部";

const catBtn = (name) => {
  const b = document.createElement("button");
  b.textContent = name;
  b.dataset.cat = name;
  if (name === activeCat) b.classList.add("active");
  b.addEventListener("click", () => {
    activeCat = name;
    catsEl.querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
    render();
  });
  return b;
};
catsEl.appendChild(catBtn("全部"));
CATS.forEach((c) => catsEl.appendChild(catBtn(c)));

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const hl = (text, q) =>
  q ? esc(text).replace(new RegExp("(" + escRe(q) + ")", "gi"), "<mark>$1</mark>") : esc(text);

function render() {
  const q = inputEl.value.trim();
  const ql = q.toLowerCase();
  const rows = TERMS.filter((t) => {
    if (activeCat !== "全部" && t.cat !== activeCat) return false;
    if (!q) return true;
    return (
      t.zh.toLowerCase().includes(ql) ||
      t.en.toLowerCase().includes(ql) ||
      t.desc.toLowerCase().includes(ql)
    );
  });

  countEl.textContent = `共 ${TERMS.length} 条术语，当前显示 ${rows.length} 条${q ? `（关键词「${q}」）` : ""}。`;

  if (!rows.length) {
    listEl.innerHTML = '<p class="search-empty">没有匹配的术语，试试英文原名或更短的关键词。</p>';
    return;
  }
  listEl.innerHTML = rows
    .map((t) => {
      const [p, id] = t.src.split("/#");
      const vz = VIZ_TERMS[t.zh];
      const vizHtml = vz && VIZ[vz.k]
        ? `<div class="gl-viz">${VIZ[vz.k]()}<p class="gl-viz-cap">${esc(vz.cap)}</p></div>`
        : "";
      return `<div class="gl-item${vz ? " has-viz" : ""}">
        <h3>${hl(t.zh, q)}</h3>
        <p class="gl-en">${hl(t.en, q)} · ${t.cat}</p>
        <p>${hl(t.desc, q)}</p>
        ${vizHtml}
        <p class="gl-src">出处：<a href="${t.src}">${p} · ${id}</a></p>
      </div>`;
    })
    .join("");
}

inputEl.addEventListener("input", render);
render();
</script>
